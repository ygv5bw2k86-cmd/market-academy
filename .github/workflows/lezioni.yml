name: Genera lezioni
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      quante:
        description: "Quante lezioni generare al massimo"
        default: "1"
permissions:
  contents: write
jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python genera_lezioni.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_LEZIONI: ${{ github.event.inputs.quante || '5' }}
      - name: Salva le lezioni
        run: |
          git config user.name "academy-bot"
          git config user.email "academy-bot@users.noreply.github.com"
          git add docs/
          git commit -m "Nuove lezioni" || echo "Niente da salvare"
          git pull --rebase
          git push
