<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Academy">
<title>Market Academy</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--ac:#1d4ed8;--bd:#e3e6ea;--ok:#15803d;--ko:#b42318;--okbg:#e8f6ee;--kobg:#fdecea;--box:#eef3ff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--tx:#e8eaed;--mut:#9aa3af;--ac:#8ab4f8;--bd:#2a2f37;--ok:#5fd08a;--ko:#ff8a80;--okbg:#12301f;--kobg:#3a1815;--box:#1b2433}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 -apple-system,system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between;align-items:center}
header a{color:var(--tx);text-decoration:none}
nav a{margin-left:14px;color:var(--ac);font-size:.95em}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(50px + env(safe-area-inset-bottom))}
h1{font-size:1.45em;line-height:1.25;margin:.3em 0 .6em}
h3{font-size:1.02em;margin:1.2em 0 .3em}
p{margin:.55em 0}
a{color:var(--ac)}
.mut{color:var(--mut);font-size:.9em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:12px 0}
summary{cursor:pointer;padding:14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";float:right;color:var(--mut)}
details[open] summary::after{content:"▴"}
.inner{padding:0 14px 14px}
.box{background:var(--box);border-radius:10px;padding:10px 12px;margin:12px 0}
.warn{background:var(--kobg);border-radius:10px;padding:10px 12px;margin:12px 0}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
@media(prefers-color-scheme:dark){.btn{color:#0f1216}}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0 2px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.spieg{font-size:.92em;color:var(--mut);margin:2px 4px 8px}
.spieg.ok{color:var(--ok)}
textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;min-height:90px;resize:vertical}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.mod{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--tx)}
.mod .n{min-width:30px;height:30px;border-radius:50%;background:var(--box);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em}
.mod.done .n{background:var(--okbg);color:var(--ok)}
.mod.dis{opacity:.5}
.chip{display:inline-block;font-size:.75em;background:var(--box);border-radius:20px;padding:1px 8px;color:var(--mut)}
.term{margin:.5em 0}
.back{display:inline-block;margin-bottom:6px;text-decoration:none}
footer{max-width:720px;margin:0 auto;padding:0 14px 30px;color:var(--mut);font-size:.8em}
</style>
</head>
<body>
<header><a href="#"><b>Market Academy</b></a><nav><a href="#">Moduli</a><a href="#diario">Diario</a><a href="#backup">Backup</a></nav></header>
<main id="app"></main>
<footer>Materiale didattico. Non è consulenza finanziaria. Il paper trading è una simulazione: non garantisce risultati reali.</footer>
<script>
const KEY = "market_academy_v1";
const VUOTO = () => ({completati: {}, quiz: {}, appunti: {}, diario: []});
let stato = carica();
let avvisato = false;

function carica() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === "object") return Object.assign(VUOTO(), s);
  } catch (e) {}
  return VUOTO();
}
function salva() {
  try { localStorage.setItem(KEY, JSON.stringify(stato)); }
  catch (e) {
    if (!avvisato) { avvisato = true; alert("Non riesco a salvare i progressi su questo browser (navigazione privata o memoria piena)."); }
  }
}

const app = document.getElementById("app");

function h(tag, props, ...figli) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const f of figli.flat(Infinity)) {
    if (f === null || f === undefined || f === false) continue;
    e.append(f.nodeType ? f : String(f));
  }
  return e;
}
const paragrafi = t => String(t || "").split(/\n+/).filter(x => x.trim()).map(x => h("p", null, x));
const num = n => String(n).padStart(2, "0");

function sezione(titolo, aperta, ...contenuto) {
  const d = h("details", null, h("summary", null, titolo), h("div", {class: "inner"}, ...contenuto));
  if (aperta) d.open = true;
  return d;
}

/* ---------- HOME ---------- */
async function vistaHome() {
  app.replaceChildren(h("p", {class: "mut"}, "Caricamento…"));
  let indice;
  try {
    const r = await fetch("indice.json", {cache: "no-cache"});
    if (!r.ok) throw 0;
    indice = await r.json();
  } catch (e) {
    app.replaceChildren(h("div", {class: "card"}, "Non riesco a caricare i moduli. Le lezioni sono state generate?"));
    return;
  }
  const fatti = indice.filter(m => stato.completati[m.id]).length;
  const prossimo = indice.find(m => m.disponibile && !stato.completati[m.id]);
  const parti = [
    h("h1", null, "Market Academy"),
    h("div", {class: "card"},
      h("b", null, "Completati " + fatti + " di " + indice.length),
      h("div", {class: "bar", style: "margin:8px 0"}, h("i", {style: "width:" + Math.round(100 * fatti / indice.length) + "%"})),
      prossimo ? h("a", {class: "btn", href: "#m" + prossimo.id}, "Continua: modulo " + prossimo.id)
               : h("span", {class: "mut"}, "Nessun nuovo modulo disponibile al momento."))
  ];
  indice.forEach(m => {
    const fatto = !!stato.completati[m.id];
    const props = {class: "card mod" + (fatto ? " done" : "") + (m.disponibile ? "" : " dis")};
    if (m.disponibile) props.href = "#m" + m.id;
    parti.push(h(m.disponibile ? "a" : "div", props,
      h("span", {class: "n"}, fatto ? "✓" : m.id),
      h("span", {style: "flex:1"}, h("div", null, m.titolo), h("span", {class: "chip"}, m.area + (m.disponibile ? "" : " · in arrivo")))));
  });
  app.replaceChildren(...parti);
}

/* ---------- LEZIONE ---------- */
async function vistaLezione(id) {
  app.replaceChildren(h("p", {class: "mut"}, "Caricamento…"));
  let l;
  try {
    const r = await fetch("lezioni/" + num(id) + ".json", {cache: "no-cache"});
    if (!r.ok) throw 0;
    l = await r.json();
  } catch (e) {
    app.replaceChildren(h("a", {href: "#", class: "back"}, "← Tutti i moduli"), h("div", {class: "card"}, "Questa lezione non è ancora disponibile."));
    return;
  }
  const done = h("button", {type: "button"});
  const aggiorna = () => {
    const f = !!stato.completati[id];
    done.textContent = f ? "Completata ✓ (tocca per annullare)" : "Segna come completata";
    done.className = f ? "btn sec" : "btn";
  };
  done.addEventListener("click", () => {
    if (stato.completati[id]) delete stato.completati[id]; else stato.completati[id] = true;
    salva(); aggiorna();
  });
  aggiorna();
  app.replaceChildren(
    h("a", {href: "#", class: "back"}, "← Tutti i moduli"),
    h("div", {class: "mut"}, "Modulo " + id + " · " + (l.area || "") + " · circa " + (l.tempo_stimato_minuti || "?") + " minuti"),
    h("h1", null, l.titolo),
    sezione("1 · Il concetto del giorno", true, bloccoConcetto(l.concetto || {})),
    sezione("2 · Il meccanismo causa-effetto", false, bloccoCausa(l.causa_effetto || {})),
    sezione("3 · Caso studio", false, bloccoCaso(l.caso_studio || {})),
    sezione("4 · Mini-quiz", false, bloccoQuiz(id, l.quiz || [])),
    sezione("5 · La simulazione del giorno", false, bloccoSimulazione(id, l.simulazione || {})),
    sezione("Riepilogo e appunti", false, bloccoRiepilogo(id, l.riepilogo || {})),
    h("div", {style: "margin:18px 0"}, done)
  );
}

function bloccoConcetto(x) {
  return [
    paragrafi(x.introduzione),
    (x.sezioni || []).map(s => [h("h3", null, s.titolo), paragrafi(s.testo)]),
    x.analogia ? h("div", {class: "box"}, h("b", null, "In parole semplici: "), x.analogia) : null,
    (x.errori_comuni && x.errori_comuni.length) ? [h("h3", null, "Errori comuni"), h("ul", null, x.errori_comuni.map(e => h("li", null, e)))] : null,
    (x.glossario && x.glossario.length) ? [h("h3", null, "Mini-glossario"), x.glossario.map(g => h("div", {class: "term"}, h("b", null, g.termine), ": ", g.definizione))] : null
  ];
}

function bloccoCausa(x) {
  return [
    x.fenomeno ? h("p", null, h("b", null, "Fenomeno: "), x.fenomeno) : null,
    h("h3", null, "La catena logica"),
    h("ol", null, (x.catena || []).map(s => h("li", null, h("b", null, s.passo), h("br"), s.spiegazione))),
    (x.impatti_tipici && x.impatti_tipici.length) ? [h("h3", null, "Effetti tipici, a parità di altre condizioni"), x.impatti_tipici.map(i => h("div", {class: "term"}, h("b", null, i.asset + ": "), i.effetto, " — ", i.motivo))] : null,
    h("div", {class: "warn"}, h("b", null, "Cosa può andare storto: "), x.cosa_puo_andare_storto || "")
  ];
}

function bloccoCaso(x) {
  return [
    h("h3", {style: "margin-top:.2em"}, x.titolo || ""),
    h("div", {class: "mut"}, x.periodo || ""),
    paragrafi(x.contesto),
    paragrafi(x.cosa_e_successo),
    x.legame_con_il_concetto ? h("div", {class: "box"}, h("b", null, "Il legame con il concetto: "), x.legame_con_il_concetto) : null,
    x.nota_sui_dati ? h("p", {class: "mut"}, "Nota sui dati: " + x.nota_sui_dati) : null
  ];
}

function bloccoQuiz(id, quiz) {
  const box = h("div");
  function disegna() {
    if (!stato.quiz[id] || !Array.isArray(stato.quiz[id].r)) stato.quiz[id] = {r: []};
    const q = stato.quiz[id];
    box.replaceChildren();
    let risposte = 0, giuste = 0;
    quiz.forEach((d, i) => {
      const dato = q.r[i];
      const risposta = (dato !== undefined && dato !== null);
      if (risposta) { risposte++; if (dato === d.indice_corretta) giuste++; }
      const domanda = h("div", {class: "card"}, h("b", null, (i + 1) + ". " + d.domanda));
      d.opzioni.forEach((o, j) => {
        let cls = "opt";
        if (risposta) { if (j === d.indice_corretta) cls += " ok"; else if (j === dato) cls += " ko"; }
        domanda.append(h("button", {class: cls, type: "button", onclick: () => {
          if (risposta) return;
          q.r[i] = j; salva(); disegna();
        }}, o.testo));
        if (risposta) {
          const prefisso = j === d.indice_corretta ? "Corretta. " : (j === dato ? "La tua risposta, sbagliata. " : "Sbagliata. ");
          domanda.append(h("div", {class: "spieg" + (j === d.indice_corretta ? " ok" : "")}, prefisso + o.spiegazione));
        }
      });
      box.append(domanda);
    });
    if (quiz.length && risposte === quiz.length) {
      box.append(h("div", {class: "box"}, h("b", null, "Punteggio: " + giuste + "/" + quiz.length), h("br"),
        h("button", {class: "btn sec", type: "button", style: "margin-top:8px", onclick: () => { stato.quiz[id] = {r: []}; salva(); disegna(); }}, "Rifai il quiz")));
    }
  }
  disegna();
  return box;
}

function bloccoSimulazione(id, s) {
  const st = s.strumento_da_osservare || {};
  const nomeStrumento = (st.nome || "") + (st.ticker ? " (" + st.ticker + ")" : "");
  const ipotesi = h("textarea", {placeholder: "Scrivi qui la tua ipotesi, prima di aprire l'ordine demo…"});
  const inval = h("textarea", {placeholder: "Scrivi qui cosa renderebbe sbagliata la tua ipotesi…"});
  const msg = h("div", {class: "mut"});
  const salvaBtn = h("button", {class: "btn", type: "button", onclick: () => {
    if (!ipotesi.value.trim() || !inval.value.trim()) { msg.textContent = "Compila sia l'ipotesi sia il criterio di invalidazione."; return; }
    stato.diario.push({
      id: Date.now(), modulo: id, titolo: s.titolo || "", strumento: nomeStrumento,
      ipotesi: ipotesi.value.trim(), invalidazione: inval.value.trim(),
      creata: new Date().toISOString().slice(0, 10), giorni: s.giorni_prima_della_revisione || 7,
      domande: s.domande_di_revisione || [], esito: "", chiusa: false
    });
    salva(); ipotesi.value = ""; inval.value = "";
    msg.replaceChildren("Salvato nel diario. ", h("a", {href: "#diario"}, "Aprilo"));
  }}, "Salva nel diario");
  return [
    h("h3", {style: "margin-top:.2em"}, s.titolo || "Esperimento"),
    h("p", null, s.obiettivo_didattico || ""),
    h("div", {class: "box"}, h("b", null, "Da osservare: "), nomeStrumento, h("br"), st.perche_adatto || ""),
    h("h3", null, "Passi"),
    h("ol", null, (s.passi || []).map(p => h("li", null, p))),
    h("h3", null, "1. La tua ipotesi"),
    h("div", {class: "mut"}, s.guida_all_ipotesi || ""),
    ipotesi,
    h("h3", null, "2. Cosa la invaliderebbe"),
    h("div", {class: "mut"}, s.guida_all_invalidazione || ""),
    inval,
    (s.cosa_registrare && s.cosa_registrare.length) ? [h("h3", null, "Cosa annotare"), h("ul", null, s.cosa_registrare.map(c => h("li", null, c)))] : null,
    h("div", {style: "margin:12px 0"}, salvaBtn),
    msg,
    s.avvertenza ? h("p", {class: "mut"}, s.avvertenza) : null
  ];
}

function bloccoRiepilogo(id, r) {
  const area = h("textarea", {placeholder: "I tuoi appunti su questo modulo…"});
  area.value = stato.appunti[id] || "";
  area.addEventListener("input", () => { stato.appunti[id] = area.value; salva(); });
  return [
    h("h3", {style: "margin-top:.2em"}, "Punti chiave"),
    h("ul", null, (r.punti_chiave || []).map(p => h("li", null, p))),
    r.domanda_di_riflessione ? h("div", {class: "box"}, h("b", null, "Per riflettere: "), r.domanda_di_riflessione) : null,
    h("h3", null, "I tuoi appunti"),
    area
  ];
}

/* ---------- DIARIO ---------- */
function vistaDiario() {
  const voci = [...stato.diario].sort((a, b) => b.id - a.id);
  const parti = [h("a", {href: "#", class: "back"}, "← Tutti i moduli"), h("h1", null, "Diario di simulazione")];
  if (!voci.length) parti.push(h("div", {class: "card"}, "Non hai ancora esperimenti. Li crei dalla sezione 5 di ogni lezione."));
  voci.forEach(e => {
    const scad = new Date(e.creata + "T00:00:00");
    scad.setDate(scad.getDate() + (Number(e.giorni) || 7));
    const daRivedere = !e.chiusa && new Date() >= scad;
    const note = h("textarea", {placeholder: "Risultato e note: com'è andata? L'ipotesi è stata confermata o invalidata? Cosa hai imparato?"});
    note.value = e.esito || "";
    note.addEventListener("input", () => { e.esito = note.value; salva(); });
    const chiusa = h("input", {type: "checkbox"});
    chiusa.checked = !!e.chiusa;
    chiusa.addEventListener("change", () => { e.chiusa = chiusa.checked; salva(); vistaDiario(); });
    parti.push(h("div", {class: "card"},
      h("div", {class: "mut"}, "Modulo " + e.modulo + " · creato il " + new Date(e.creata + "T00:00:00").toLocaleDateString("it-IT")),
      h("b", null, e.titolo),
      h("div", null, "Strumento osservato: " + e.strumento),
      daRivedere ? h("div", {class: "warn"}, "È ora di rivedere questo esperimento.")
                 : h("div", {class: "mut"}, e.chiusa ? "Concluso" : "Revisione consigliata dal " + scad.toLocaleDateString("it-IT")),
      h("h3", null, "Ipotesi"), h("p", null, e.ipotesi),
      h("h3", null, "Cosa la invaliderebbe"), h("p", null, e.invalidazione),
      (e.domande && e.domande.length) ? [h("h3", null, "Domande per la revisione"), h("ul", null, e.domande.map(d => h("li", null, d)))] : null,
      h("h3", null, "Esito"), note,
      h("label", {style: "display:block;margin:10px 0"}, chiusa, " Esperimento concluso"),
      h("button", {class: "btn sec", type: "button", onclick: () => {
        if (confirm("Eliminare questo esperimento dal diario?")) {
          stato.diario = stato.diario.filter(x => x.id !== e.id); salva(); vistaDiario();
        }
      }}, "Elimina")
    ));
  });
  app.replaceChildren(...parti);
}

/* ---------- BACKUP ---------- */
function vistaBackup() {
  const area = h("textarea", {style: "min-height:160px", placeholder: "Qui compaiono i tuoi dati (esporta) oppure incolla un backup (importa)…"});
  const msg = h("p", {class: "mut"});
  app.replaceChildren(
    h("a", {href: "#", class: "back"}, "← Tutti i moduli"),
    h("h1", null, "Backup dei progressi"),
    h("p", null, "I progressi sono salvati solo su questo dispositivo e browser. Per fare una copia o passare a un altro dispositivo, esporta i dati, copia il testo e conservalo (per esempio in Note). Poi incollalo dove vuoi e importalo."),
    h("div", {class: "card"},
      h("button", {class: "btn", type: "button", onclick: () => {
        area.value = JSON.stringify(stato); area.focus(); area.select();
        msg.textContent = "Dati pronti: copia tutto il testo e conservalo.";
      }}, "1. Esporta i miei dati"),
      h("div", {style: "height:10px"}), area, h("div", {style: "height:10px"}),
      h("button", {class: "btn sec", type: "button", onclick: () => {
        try {
          const d = JSON.parse(area.value);
          if (!d || typeof d !== "object" || Array.isArray(d)) throw 0;
          if (!confirm("Sostituire i dati attuali con questo backup?")) return;
          stato = Object.assign(VUOTO(), d);
          if (!Array.isArray(stato.diario)) stato.diario = [];
          salva(); msg.textContent = "Backup importato.";
        } catch (e) { msg.textContent = "Il testo incollato non è un backup valido."; }
      }}, "2. Importa dal testo incollato"),
      msg)
  );
}

/* ---------- ROUTER ---------- */
function route() {
  const hash = location.hash.replace("#", "");
  window.scrollTo(0, 0);
  if (/^m\d+$/.test(hash)) vistaLezione(parseInt(hash.slice(1), 10));
  else if (hash === "diario") vistaDiario();
  else if (hash === "backup") vistaBackup();
  else vistaHome();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
